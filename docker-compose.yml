# 로컬 개발용 인프라. `docker compose up -d` 한 번으로 DB와 Redis가 뜬다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticklock
      POSTGRES_USER: ticklock
      POSTGRES_PASSWORD: ticklock   # 로컬 전용 비밀번호. 배포 시에는 반드시 환경변수/시크릿으로 교체
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # 컨테이너를 지워도 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticklock"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # 이 PC에 JDK가 없어도 백엔드를 돌릴 수 있게 gradle 컨테이너에서 bootRun 한다.
  # JDK 17을 설치했다면 이 서비스 없이 IDE/`./gradlew bootRun`으로 실행해도 된다.
  backend:
    image: gradle:8.10-jdk17
    working_dir: /home/gradle/project
    command: gradle bootRun --no-daemon
    environment:
      # 컨테이너 안에서는 localhost가 자기 자신이므로 서비스 이름으로 접근한다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticklock?reWriteBatchedInserts=true
      SPRING_DATA_REDIS_HOST: redis
      # 시세 저장 방식 전환: `TICK_STORAGE_MODE=direct docker compose up -d backend` (기본 batch)
      TICKLOCK_TICK_STORAGE_MODE: ${TICK_STORAGE_MODE:-batch}
      # 개발용 관찰 화면(/debug)용 API를 로컬에서만 켠다. 배포 환경에서는 이 값을 넣지 않는다.
      TICKLOCK_DEBUG_ENABLED: "true"
      # 체결 모드 전환: `EXECUTION_MODE=naive docker compose up -d backend` (기본 safe)
      TICKLOCK_EXECUTION_MODE: ${EXECUTION_MODE:-safe}
    volumes:
      - ./backend:/home/gradle/project
      - gradle-cache:/home/gradle/.gradle   # 의존성 캐시. 재시작 시 다시 받지 않는다.
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  gradle-cache:
